<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор Lorem Ipsum</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; align-items: flex-end; }
    input { width: 80px; padding: 5px; }
    button { padding: 6px 15px; cursor: pointer; }
    #output { white-space: pre-wrap; background: #f4f4f4; padding: 15px; border-radius: 5px; }
    nav { margin-bottom: 20px; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Главная</a> | <a href="/about">О проекте</a>
  </nav>

  <h1>Генератор Lorem Ipsum</h1>
  
  <div class="controls">
    <label>Слов в абзаце:<br><input type="number" id="words" value="20"></label>
    <label>Абзацев:<br><input type="number" id="paragraphs" value="1"></label>
    <button id="generateBtn">Сгенерировать</button>
  </div>

  <div id="output">Нажмите «Сгенерировать»...</div>

  <script src="/app.js"></script>
</body>
</html>
