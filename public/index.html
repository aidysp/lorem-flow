<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoremFlow — Генератор Lorem Ipsum</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <nav>
      <a href="/" class="logo">📝 LoremFlow</a>
      <div class="nav-links">
        <a href="/" class="active">Генератор</a>
        <a href="/about">О проекте</a>
      </div>
    </nav>

    <main class="card">
      <h1>Генератор Lorem Ipsum</h1>
      <p class="subtitle">Быстрая генерация текста-рыбы через Express API или офлайн</p>

      <div class="controls">
        <div class="input-group">
          <label for="words">Слов в абзаце</label>
          <input type="number" id="words" value="25" min="1" max="1000">
        </div>
        <div class="input-group">
          <label for="paragraphs">Абзацев</label>
          <input type="number" id="paragraphs" value="2" min="1" max="50">
        </div>
        <button id="generateBtn" class="btn-primary">Сгенерировать</button>
      </div>

      <div class="output-wrapper">
        <div class="output-header">
          <span class="stats" id="stats">Готов к работе</span>
          <button id="copyBtn" class="btn-copy">Копировать</button>
        </div>
        <div id="output">Нажмите «Сгенерировать», чтобы получить текст...</div>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
